name: GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * 0"     # weekly, Sunday 06:00 UTC
  workflow_dispatch:          # run on demand from the Actions tab

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # A Personal Access Token you create once and store as a repo secret.
          # See the README section note for the two scopes it needs.
          token: ${{ secrets.METRICS_TOKEN }}

          user: juandresrodca
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Dublin

          # What the card shows: overall stats header + languages breakdown
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_details: percentage

          # Dark background + green accents to match the profile
          extras_css: >
            .background { fill: #0a0e16 !important; }
            body, .field, h2, .title, .value, text, tspan { color: #9fef00 !important; }
            .no-color { color: #c9f299 !important; }
            a { color: #9fef00 !important; }

          # Commit the generated SVG back into the repo
          output_action: commit
          committer_message: "chore: refresh GitHub metrics"
